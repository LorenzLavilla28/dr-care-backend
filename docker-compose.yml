services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drcare}
      POSTGRES_USER: ${POSTGRES_USER:-drcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drcare} -d ${POSTGRES_DB:-drcare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-drcare};Username=${POSTGRES_USER:-drcare};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      DevelopmentAdminPassword: ${DEVELOPMENT_ADMIN_PASSWORD:?Set DEVELOPMENT_ADMIN_PASSWORD in .env}
      Storage__Local__BaseUrl: http://localhost:8080
      Storage__Local__RootPath: /tmp/dr-care-storage
      Storage__Local__Secret: ${LOCAL_STORAGE_SECRET:-local-development-storage-secret-change-me}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - local_storage:/tmp/dr-care-storage

volumes:
  postgres_data:
  local_storage:
