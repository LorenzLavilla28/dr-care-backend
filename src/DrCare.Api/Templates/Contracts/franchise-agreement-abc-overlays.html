<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dr. Care Animal Bite Clinic Franchise Agreement</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: Calibri, Arial, sans-serif; color: #000; }
    .page {
      position: relative;
      width: 595.4pt;
      height: 841.8pt;
      overflow: hidden;
      page-break-after: always;
      background: transparent;
    }
    .page:last-child { page-break-after: auto; }
    .value {
      position: absolute;
      font-size: 12pt;
      line-height: 12pt;
      white-space: nowrap;
    }
    .bold { font-weight: 700; }
    .fit { overflow: hidden; text-overflow: clip; }
    .line-value {
      height: 13pt;
      padding: 0 2pt 1pt;
      border-bottom: .7pt solid #000;
      background: #fff;
      font-size: 10.5pt;
      line-height: 11pt;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="page">
    <span class="value bold fit" style="left:36pt;top:126.2pt;width:164pt">{{fullNameUpper}}</span>
    <span class="value line-value fit" style="left:408pt;top:124.5pt;width:151pt">{{franchiseeAddress}}</span>
  </section>
  <section class="page">
    <span class="value line-value fit" style="left:281pt;top:51.3pt;width:141pt">{{franchisedSite}}</span>
    <span class="value fit" style="left:152.1pt;top:141pt;width:86pt;font-size:10.5pt">{{effectiveDate}}</span>
  </section>
  <section class="page">
    <span class="value fit" style="left:206.3pt;top:492.7pt;width:90pt">{{initialFranchiseFee}}</span>
  </section>
  <section class="page"></section>
  <section class="page"></section>
  <section class="page"></section>
  <section class="page"></section>
  <section class="page"></section>
  <section class="page">
    <span class="value fit" style="left:91.8pt;top:346.1pt;width:150pt;font-size:10.5pt">{{signingDateLong}}</span>
    <span class="value fit" style="left:306.5pt;top:375.5pt;width:145pt">{{fullNameUpper}}</span>
    <span class="value fit" style="left:91.8pt;top:404.7pt;width:150pt;font-size:10.5pt">{{signingDateLong}}</span>
  </section>
  <section class="page">
    <span class="value fit" style="left:36pt;top:218.8pt;width:160pt">{{fullNameUpper}}</span>
    <span class="value fit" style="left:36pt;top:453.3pt;width:100pt">Series of {{seriesYear}}</span>
  </section>
</body>
</html>
